version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - NODE_ENV=development
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
    depends_on:
      - firebase-emulator

  firebase-emulator:
    image: mtlynch/firestore-emulator
    ports:
      - '8081:8080'
    environment:
      - FIRESTORE_PROJECT_ID=afoodoo-dev-app
